<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Treino do dia</title>
<style>
  @font-face { font-family: "Barlow"; font-weight: 400; font-style: normal; font-display: swap; src: url(fonts/Barlow-400.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 500; font-style: normal; font-display: swap; src: url(fonts/Barlow-500.woff2) format("woff2"); }
  @font-face { font-family: "Barlow"; font-weight: 600; font-style: normal; font-display: swap; src: url(fonts/Barlow-600.woff2) format("woff2"); }
  @font-face { font-family: "Big Shoulders Display"; font-weight: 700 900; font-style: normal; font-display: swap; src: url(fonts/BigShouldersDisplay-700.woff2) format("woff2"); }

  :root {
    color-scheme: dark;
    --rubber: #121212;
    --rubber-2: #1a1a1b;
    --rubber-3: #252527;
    --line: #36363a;
    --chalk: #f1f1ec;
    --muted: #a6a69f;
    --on-plate: #141414;
    --hint: #8c8c92;
    --rim-ink: rgba(0, 0, 0, .22);
    --plate: #f0444f;
    --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --dock-h: 84px;
  }
  body[data-day="seg"] { --plate: #f0444f; }
  body[data-day="ter"] { --plate: #4a7cf0; }
  body[data-day="qua"] { --plate: #f2c230; }
  body[data-day="qui"] { --plate: #3fbf68; }
  body[data-day="sex"] { --plate: #f1f1ec; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--rubber); }
  body {
    margin: 0; background: var(--rubber); color: var(--chalk);
    font: 400 17px/1.45 var(--body); font-variant-numeric: tabular-nums;
    caret-color: var(--plate); text-wrap: pretty;
  }
  ::selection { background: var(--plate); color: var(--on-plate); }
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  button, input, textarea { font: inherit; color: inherit; }
  button { touch-action: manipulation; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--chalk); outline-offset: 3px; border-radius: 6px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .skip { position: absolute; left: 8px; top: -60px; background: var(--chalk); color: var(--on-plate); padding: 10px 14px; border-radius: 14px; z-index: 20; }
  .skip:focus { top: 8px; }
  svg.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Topo: pessoa + rack de discos dos dias */
  .top { padding: max(14px, env(safe-area-inset-top)) 16px 4px; max-width: 560px; margin: 0 auto; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; }
  .tools { display: flex; align-items: center; gap: 8px; }
  .acct { position: relative; font: 800 22px/1 var(--display); }
  .acct i { position: absolute; right: 1px; bottom: 1px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--rubber); background: var(--muted); }
  .acct[data-s="ok"] i { background: #3fbf68; }
  .acct[data-s="pending"] i, .acct[data-s="syncing"] i, .acct[data-s="offline"] i { background: #f2c230; }
  .acct[data-s="error"] i { background: #f0444f; }
  .noauth .rack, .noauth .wname, .noauth .rail, .noauth .dock, .noauth #ovbtn, .noauth #acctbtn { display: none; }
  .noauth .top { display: none; }
  .noauth main { padding-bottom: 24px; }
  .auth { min-height: calc(100dvh - 28px); display: flex; flex-direction: column; justify-content: center; gap: 26px; max-width: 440px; margin: 0 auto; padding: 20px 0 8px; }
  .brand { text-align: center; }
  .brand svg { display: block; width: min(100%, 320px); height: auto; margin: 0 auto 18px; overflow: visible; }
  .brand .pl { animation: load .5s var(--ease) both; animation-delay: calc(var(--i) * 50ms); transform-box: fill-box; transform-origin: center; }
  @keyframes load { from { opacity: 0; transform: translateX(calc(var(--s) * 20px)); } }
  .brand h1 { margin: 0; font: 900 clamp(46px, 15vw, 64px)/.92 var(--display); letter-spacing: .02em; text-transform: uppercase; }
  .brand p { margin: 10px 0 0; color: var(--muted); font-size: 18px; }
  .card { background: var(--rubber-2); border-radius: 20px; padding: 18px 16px 16px; }
  .card h2 { margin: 0 0 14px; font: 800 28px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .auth label { display: block; margin: 0 0 6px; font: 700 18px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .field { width: 100%; height: 56px; margin: 0 0 14px; padding: 0 16px; border: 2px solid transparent; border-radius: 14px; background: var(--rubber-3); font-size: 18px; }
  .field:focus { outline: 0; border-color: var(--chalk); }
  .field::placeholder { color: var(--hint); opacity: 1; }
  .pw { position: relative; }
  .pw .field { padding-right: 60px; }
  .pw button { position: absolute; right: 4px; top: 4px; width: 48px; height: 48px; border: 0; border-radius: 12px; background: none; display: grid; place-items: center; color: var(--muted); }
  .pw button[aria-pressed="true"] { color: var(--chalk); }
  .btn { width: 100%; height: 60px; border: 0; border-radius: 16px; background: var(--plate); color: var(--on-plate); font: 800 26px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .btn:active { transform: scale(.985); }
  .btn:disabled { opacity: .5; }
  .btn.ghost { background: var(--rubber-3); color: var(--chalk); height: 54px; font-size: 22px; }
  .or { display: flex; align-items: center; gap: 12px; margin: 20px 0 14px; color: var(--muted); font-size: 15px; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .help { margin: 12px 0 0; color: var(--muted); font-size: 15px; text-align: center; }
  .msg { min-height: 1.4em; margin: 12px 0 0; font-size: 16px; color: var(--chalk); text-align: center; }
  .msg.err { color: #ff8a93; }
  .sent { text-align: center; }
  .sent .seal { width: 72px; height: 72px; margin: 4px auto 14px; border-radius: 50%; background: var(--plate); color: var(--on-plate); display: grid; place-items: center; position: relative; }
  .sent .seal::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 2px solid var(--rim-ink); }
  .sent .seal .ic { width: 34px; height: 34px; }
  .sent p { margin: 0 0 10px; overflow-wrap: anywhere; }
  .sent b { font-weight: 600; }
  .sent .btn { margin-top: 8px; }
  #acct .row { margin: 0 0 18px; }
  #acct h3 { margin: 0 0 8px; font: 700 18px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #acct p { margin: 0 0 10px; overflow-wrap: anywhere; }
  #acct .btn { height: 52px; font-size: 22px; }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--rubber-3); display: grid; place-items: center; }
  .iconbtn[aria-pressed="true"] { background: var(--chalk); color: var(--on-plate); }

  .rack { display: flex; justify-content: space-between; gap: 6px; margin: 16px 0 0; }
  .day { --c: #f0444f; width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--c); background: none; color: var(--chalk); font: 800 19px/1 var(--display); letter-spacing: .04em; display: grid; place-items: center; transition: background-color .18s var(--ease), color .18s var(--ease), transform .18s var(--ease); }
  .day[data-d="seg"] { --c: #f0444f; } .day[data-d="ter"] { --c: #4a7cf0; } .day[data-d="qua"] { --c: #f2c230; } .day[data-d="qui"] { --c: #3fbf68; } .day[data-d="sex"] { --c: #f1f1ec; }
  .day[aria-selected="true"] { background: var(--c); color: var(--on-plate); }
  .day:active { transform: scale(.94); }
  .wname { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 12px 0 4px; font: 700 20px/1.1 var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  /* Régua do treino: um segmento por exercício, largura = número de séries */
  .rail { list-style: none; display: flex; gap: 4px; margin: 0 0 6px; padding: 0; }
  .rail li { display: flex; min-width: 0; }
  .rail button { position: relative; flex: 1; border: 0; background: none; height: 30px; padding: 0; display: flex; align-items: flex-end; }
  .rail .seg { display: block; width: 100%; height: 10px; border-radius: 3px; background: var(--rubber-3); position: relative; overflow: hidden; }
  .rail .seg i { position: absolute; inset: 0; background: var(--plate); transform: scaleX(0); transform-origin: left; transition: transform .25s var(--ease); }
  .rail button[aria-current="step"]::before { content: ""; position: absolute; left: 50%; top: 2px; width: 0; height: 0; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--chalk); border-bottom: 0; }

  main { max-width: 560px; margin: 0 auto; padding: 4px 16px calc(var(--dock-h) + 28px + env(safe-area-inset-bottom)); }
  .enter { animation: slide .2s var(--ease) both; }
  @keyframes slide { from { opacity: 0; transform: translateX(calc(var(--dir, 0) * 18px)); } to { opacity: 1; transform: none; } }

  /* Exercício */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 40%; gap: 6px 14px; align-items: start; margin: 12px 0 16px; }
  .hero .txt { min-width: 0; }
  h2 { margin: 0 0 8px; font: 800 clamp(23px, 7vw, 31px)/1 var(--display); letter-spacing: .01em; text-transform: uppercase; overflow-wrap: break-word; hyphens: auto; }
  .count { flex: none; font: 700 20px/1 var(--display); color: var(--muted); letter-spacing: .06em; }
  .count b { color: var(--chalk); font-weight: 800; }

  .fig { position: relative; margin: 0; padding: 0; border: 0; background: #ecebe4; border-radius: 20px; display: grid; place-items: center; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; }
  .fig img { display: block; width: 100%; height: 100%; padding: 8px; object-fit: contain; mix-blend-mode: multiply; }
  .fig .badge { position: absolute; left: 8px; top: 8px; width: 34px; height: 34px; border-radius: 50%; background: var(--plate); color: var(--on-plate); font: 800 20px/1 var(--display); display: grid; place-items: center; }
  .hero.zoom { grid-template-columns: 1fr; }
  .hero.zoom .fig { aspect-ratio: 4 / 3; order: 2; }

  .spec { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; margin-bottom: 10px; }
  .spec .sx { font: 800 42px/1 var(--display); letter-spacing: .01em; }
  .spec .sx small { font: 600 16px/1 var(--body); color: var(--muted); letter-spacing: 0; margin-left: 4px; }
  .spec .rest { font-size: 16px; color: var(--muted); line-height: 1.3; }
  .spec .rest b { color: var(--chalk); font-weight: 600; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .tags li { padding: 5px 12px; border-radius: 14px; background: var(--rubber-3); font-size: 15px; font-weight: 500; line-height: 1.25; }

  .pinned { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--rubber-3); white-space: pre-line; font-size: 16px; }
  .pinned .ic { width: 20px; height: 20px; margin-top: 2px; color: var(--plate); }
  .last { margin: 0 0 14px; color: var(--muted); font-size: 16px; }

  .block { background: var(--rubber-2); border-radius: 20px; padding: 12px; margin-bottom: 12px; }
  .load { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .load label { color: var(--chalk); font: 700 20px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; }
  .stepper { display: flex; align-items: center; background: var(--rubber-3); border-radius: 14px; }
  .stepper > button { width: 52px; height: 52px; border: 0; background: none; border-radius: 14px; display: grid; place-items: center; }
  .stepper > button:active { background: var(--line); }
  .stepper input { width: 88px; height: 52px; border: 0; background: none; text-align: center; font: 800 32px/1 var(--display); letter-spacing: .02em; }
  .stepper input::placeholder { color: var(--hint); opacity: 1; }
  .stepper .unit { font-size: 15px; color: var(--muted); margin: 0 6px 0 -6px; }

  .sets { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .set { display: grid; grid-template-columns: 56px minmax(0, 1fr) 68px; align-items: center; gap: 8px; scroll-margin-bottom: calc(var(--dock-h) + 20px); }
  .disc { position: relative; width: 56px; height: 56px; border-radius: 50%; border: 4px solid var(--plate); background: none; display: grid; place-items: center; font: 800 26px/1 var(--display); transition: background-color .15s var(--ease); }
  .disc::before, .day::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--plate) 38%, transparent); pointer-events: none; transition: border-color .15s; }
  .day { position: relative; }
  .day::before { inset: 4px; border-color: color-mix(in srgb, var(--c) 38%, transparent); }
  .disc[aria-pressed="true"]::before { border-color: var(--rim-ink); }
  .day[aria-selected="true"]::before { border-color: var(--rim-ink); }
  .disc .ic { position: absolute; color: var(--on-plate); opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s var(--ease); width: 28px; height: 28px; }
  .disc .n { transition: opacity .1s; }
  .disc[aria-pressed="true"] { background: var(--plate); }
  .disc[aria-pressed="true"] .ic { opacity: 1; transform: none; }
  .disc[aria-pressed="true"] .n { opacity: 0; }
  .disc.seat { animation: seat .26s var(--ease); }
  @keyframes seat { 0% { transform: scale(.86); } 55% { transform: scale(1.08); } 100% { transform: scale(1); } }
  .reps { display: flex; align-items: center; justify-content: center; background: var(--rubber-3); border-radius: 14px; }
  .reps button { width: 46px; height: 52px; flex: none; border: 0; background: none; border-radius: 14px; display: grid; place-items: center; }
  .reps button:active { background: var(--line); }
  .reps output { flex: 1; text-align: center; font: 800 34px/1 var(--display); min-width: 0; }
  .reps output small { display: block; font: 500 13px/1 var(--body); color: var(--muted); margin-top: 2px; letter-spacing: .04em; }
  .set:not([data-done]) .reps output { color: var(--muted); }
  .type { height: 52px; min-width: 0; padding: 0; border: 0; border-radius: 14px; background: var(--rubber-3); color: var(--muted); font-weight: 600; font-size: 15px; }
  .type[data-t="drop"], .type[data-t="pausa"] { background: var(--chalk); color: var(--on-plate); }

  .rir p { margin: 0 0 10px; color: var(--muted); font-size: 16px; }
  .rir p b { color: var(--chalk); font-weight: 600; }
  .rir div { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .rir button { height: 52px; border-radius: 14px; border: 0; background: var(--rubber-3); font: 800 26px/1 var(--display); }
  .rir button[aria-pressed="true"] { background: var(--plate); color: var(--on-plate); }

  details { background: var(--rubber-2); border-radius: 20px; margin-bottom: 14px; }
  summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; font: 700 20px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; border-radius: 20px; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: ""; width: 10px; height: 10px; border-right: 2.4px solid var(--muted); border-bottom: 2.4px solid var(--muted); transform: rotate(45deg); margin-right: 4px; transition: transform .2s var(--ease); }
  details[open] summary::after { transform: rotate(-135deg); margin-top: 6px; }
  .dbody { padding: 0 16px 16px; }
  .cues { margin: 0; padding: 0; list-style: none; display: grid; gap: 12px; }
  .cues li { position: relative; padding-left: 24px; max-width: 65ch; }
  .cues li::before { content: ""; position: absolute; left: 0; top: .55em; width: 10px; height: 10px; border-radius: 50%; background: var(--plate); }
  .warn { margin: 14px 0 0; padding: 12px 14px; border-radius: 14px; background: var(--rubber-3); font-size: 16px; }
  .warn b { font-weight: 600; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 10px; }
  .chips button { height: 44px; padding: 0 16px; border-radius: 999px; border: 0; background: var(--rubber-3); font-weight: 500; font-size: 16px; }
  textarea { width: 100%; background: var(--rubber-3); border: 0; border-radius: 14px; padding: 12px 14px; font-size: 17px; resize: vertical; min-height: 88px; }
  textarea::placeholder { color: var(--hint); opacity: 1; }

  /* Visão do treino */
  .ovlist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
  .ovrow { width: 100%; display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 14px; text-align: left; border: 0; background: var(--rubber-2); padding: 10px 16px 10px 10px; border-radius: 18px; min-height: 68px; }
  .ovrow .dn { width: 48px; height: 48px; border-radius: 50%; border: 4px solid var(--plate); display: grid; place-items: center; font: 800 22px/1 var(--display); }
  .ovrow[data-all] .dn { background: var(--plate); color: var(--on-plate); }
  .ovrow .nm { font-weight: 600; font-size: 18px; line-height: 1.2; }
  .ovrow .ct { font: 800 24px/1 var(--display); color: var(--muted); }
  .ovrow[data-all] .ct { color: var(--chalk); }
  .ovfoot { margin-top: 22px; display: flex; justify-content: center; }
  .reset { display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 20px; border-radius: 14px; border: 2px solid var(--line); background: none; color: var(--muted); font-weight: 500; }

  /* Doca: anterior, descanso, próximo */
  .dock { position: fixed; inset: auto 0 0 0; z-index: 10; background: var(--rubber); border-top: 1px solid var(--line); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .dock .in { max-width: 528px; margin: 0 auto; display: flex; align-items: center; gap: 8px; }
  .nb { flex: none; height: 56px; border-radius: 16px; border: 0; display: flex; align-items: center; justify-content: center; gap: 4px; font: 800 22px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .nb.prev { width: 48px; background: var(--rubber-3); }
  .nb.prev:disabled { visibility: hidden; }
  .nb.next { width: 60px; padding: 0; background: var(--rubber-3); color: var(--chalk); transition: background-color .2s var(--ease), color .2s var(--ease); }
  .nb.next[data-ready] { background: var(--plate); color: var(--on-plate); }
  .timer { flex: 1 1 0; min-width: 0; height: 56px; padding: 0; border: 0; background: none; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 16px; }
  .ring { width: 40px; height: 40px; flex: none; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 6; }
  .ring .bg { stroke: var(--rubber-3); }
  .ring .fg { stroke: var(--plate); stroke-linecap: butt; stroke-dasharray: 113.1; stroke-dashoffset: 113.1; transition: stroke-dashoffset .25s linear; }
  .timer .t { font: 800 32px/1 var(--display); letter-spacing: .01em; text-align: left; }
  .timer[data-state="idle"] .t { color: var(--muted); }
  .timer[data-state="done"] .ring .fg { stroke-dashoffset: 0; }
  .timer[data-state="done"] .t { color: var(--plate); }
  .timer[data-state="done"] { animation: nudge .5s var(--ease) 2; }
  @keyframes nudge { 0%, 100% { transform: none; } 30% { transform: scale(1.06); } }
  .timer[data-state="paused"] .t { color: var(--muted); }
  .timer[data-state="paused"] .ring { opacity: .6; }

  dialog { width: 100%; max-width: 560px; margin: auto auto 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom)); border: 0; border-radius: 20px 20px 0 0; background: var(--rubber-2); color: var(--chalk); }
  dialog[open] { animation: rise .24s var(--ease); }
  dialog::backdrop { background: rgba(0, 0, 0, .62); }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .sh-head { display: flex; align-items: center; justify-content: space-between; }
  .sh-head h2 { margin: 0; font: 800 26px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .big { text-align: center; font: 800 104px/1 var(--display); letter-spacing: .01em; margin: 10px 0 14px; }
  .big[data-state="paused"] { color: var(--muted); }
  .big[data-state="done"] { color: var(--plate); }
  .meter { height: 12px; border-radius: 6px; background: var(--rubber-3); overflow: hidden; margin-bottom: 18px; }
  .meter i { display: block; height: 100%; background: var(--plate); transform-origin: left; transition: transform .25s linear; }
  .adj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .adj button { height: 64px; border: 0; border-radius: 16px; background: var(--rubber-3); font: 800 30px/1 var(--display); letter-spacing: .02em; }
  .adj button:active { background: var(--line); }
  .acts { display: grid; grid-template-columns: 1fr 120px; gap: 8px; }
  .acts button { height: 60px; border: 0; border-radius: 16px; font: 800 26px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .acts .go { background: var(--plate); color: var(--on-plate); }
  .acts .zero { background: var(--rubber-3); }
  dialog { max-height: 92dvh; overflow-y: auto; }

  @media (max-width: 380px) {
    .dock .in { gap: 6px; }
    .ring { width: 32px; height: 32px; }

const $ = (s, el = document) => el.querySelector(s);
const safe = (fn, d) => { try { return fn(); } catch { return d; } };

const TYPES = ["normal", "drop", "pausa"];
// Tipo pré-marcado pela ficha. "Drop set" sem "última série" é assumido na última série.
function presetType(e, si) {
  const last = si === e.s - 1, t = e.tech || "";
  if (/drop/i.test(t)) return last ? "drop" : "normal";
  if (/^Isometria/i.test(t)) return "pausa";
  if (/última série com pausa/i.test(t)) return last ? "pausa" : "normal";
  return "normal";
}
function normSet(m, e, si) {
  if (m && typeof m === "object") return m;
  return { done: !!m, reps: topOf(e.r), type: presetType(e, si) };
}

  const marks = data.sets[e.n];

}

const icon = n => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v; // somente ícones estáticos internos
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const k of kids) e.append(k);
  return e;
}

// ---- Timer de descanso: anel na doca + folha de ajuste ----
const CIRC = 113.1;
let tId = null, tEnd = 0, tTotal = 0, tHold = 0, tState = "idle", idleSecs = null;
const timerBtn = $("#timer"), sheet = $("#sheet");
timerBtn.innerHTML = `<svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle class="bg" cx="24" cy="24" r="18"/><circle class="fg" cx="24" cy="24" r="18"/></svg><span class="t">0:00</span>`;
const ringFg = () => $(".fg", timerBtn), dockT = () => $(".t", timerBtn);
function suggestedRest() { const w = curW(); return REST[w.id][Math.max(0, state.idx)]?.[0] ?? 90; }
function left() {
  if (tState === "running") return Math.max(0, Math.ceil((tEnd - Date.now()) / 1000));
  if (tState === "paused") return Math.ceil(tHold / 1000);
  if (tState === "done") return 0;
  return idleSecs ?? suggestedRest();
}
const STATE_LABEL = { idle: "Descanso parado", running: "Descanso em andamento", paused: "Descanso pausado", done: "Descanso terminou" };
function paintTimer() {
  const l = left(), total = Math.max(tTotal, l, 1);
  timerBtn.dataset.state = tState;
  dockT().textContent = fmtClock(l);
  ringFg().style.strokeDashoffset = String(tState === "idle" ? CIRC : tState === "done" ? 0 : CIRC * (1 - l / total));
  timerBtn.setAttribute("aria-label", `${STATE_LABEL[tState]}, ${fmtClock(l)}. Abrir ajustes`);
  const big = $("#bigt"); big.textContent = fmtClock(l); big.dataset.state = tState;
  $("#bigbar").style.transform = `scaleX(${tState === "idle" ? 1 : l / total})`;
  $("#sh-go").textContent = { idle: "Iniciar", running: "Pausar", paused: "Retomar", done: "Iniciar" }[tState];
  $("#sh-zero").disabled = tState === "idle" && idleSecs === ZERAR_S;
}
const idleTimerLabel = () => { if (tState === "idle") paintTimer(); };
function tick() { if (tState === "running" && left() === 0) finish(); else paintTimer(); }
function startTimer(s) { clearInterval(tId); tTotal = s; tEnd = Date.now() + s * 1000; tState = "running"; tId = setInterval(tick, 250); paintTimer(); }
function pauseTimer() { tHold = Math.max(0, tEnd - Date.now()); clearInterval(tId); tState = "paused"; paintTimer(); }
function resumeTimer() { tEnd = Date.now() + tHold; tState = "running"; tId = setInterval(tick, 250); paintTimer(); }
function finish() {
  clearInterval(tId); tState = "done"; paintTimer(); say("Descanso terminou");
  safe(() => navigator.vibrate && navigator.vibrate([200, 100, 200]));
}
// Zerar volta sempre a 1:00, não ao descanso sugerido do exercício.
const ZERAR_S = 60;
function resetTimer() { clearInterval(tId); tState = "idle"; idleSecs = ZERAR_S; paintTimer(); }
// Ajusta para cima ou para baixo em qualquer estado; chegar a zero encerra o descanso.
function adjust(d) {
  if (tState === "running") {
    tEnd += d * 1000; tTotal = Math.max(1, tTotal + d);
    if (left() === 0) finish(); else paintTimer();
  } else if (tState === "paused") {
    tHold = Math.max(0, tHold + d * 1000); tTotal = Math.max(1, tTotal + d); paintTimer();
  } else if (tState === "done") {
    if (d > 0) startTimer(d);
  } else { idleSecs = Math.max(15, left() + d); paintTimer(); }
}
function openSheet() {
  paintTimer();
  if (typeof sheet.showModal === "function") sheet.showModal(); else sheet.setAttribute("open", "");
}
function closeSheet() { if (typeof sheet.close === "function") sheet.close(); else sheet.removeAttribute("open"); timerBtn.focus(); }
$("#sheet-x").innerHTML = icon("close");
timerBtn.addEventListener("click", openSheet);
$("#sheet-x").addEventListener("click", closeSheet);
sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
sheet.querySelectorAll(".adj button").forEach(b => b.addEventListener("click", () => adjust(+b.dataset.d)));
$("#sh-go").addEventListener("click", () => {
  if (tState === "running") pauseTimer();
  else if (tState === "paused") resumeTimer();
  else startTimer(tState === "done" ? suggestedRest() : left());
});
$("#sh-zero").addEventListener("click", resetTimer);
paintTimer();

function scheduleFlush(ms = 1500) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
function markDirty(wid, exId, date = todayKey()) {

async function flush() {
  if (!sb || !uid() || !navigator.onLine || flushing) return;
  const snap = readDirty();
  const days = Object.entries(snap.days), notes = Object.entries(snap.notes);
  if (!days.length && !notes.length) { paintAcct(); return; }
  flushing = true; syncErr = false; paintAcct();
  try {
    const setRows = [], exRows = [], noteRows = [];
    for (const [key, exs] of days) {
      const [date, wid] = key.split("|");
      const day = safe(() => JSON.parse(localStorage.getItem(dayKeyFor(date, wid))), null);
      const w = WORKOUTS.find(x => x.id === wid);
      if (!day || !w) continue;
      for (const e of w.ex.filter(x => exs[x.id])) {
        const sets = day.sets?.[e.n]; if (!sets) continue;
        const kg = parseKg(day.kg?.[e.n]);
        sets.forEach((m, i) => { if (m && typeof m === "object") setRows.push({ user_id: uid(), session_date: date, workout_id: wid, exercise_id: e.id, set_index: i, reps: m.reps, kg, set_type: m.type, done: !!m.done }); });
        exRows.push({ user_id: uid(), session_date: date, workout_id: wid, exercise_id: e.id, rir: day.rir?.[e.n] ?? null });
      }
    }
    for (const [exId] of notes) noteRows.push({ user_id: uid(), exercise_id: exId, note: safe(() => localStorage.getItem(noteKey(EX_NAME[exId])), "") || "" });
    const run = async (table, rows, onConflict) => {
      if (!rows.length) return;
      const { error } = await sb.from(table).upsert(rows, { onConflict });
      if (error) throw error;
    };
    await run("set_logs", setRows, "user_id,session_date,workout_id,exercise_id,set_index");
    await run("exercise_logs", exRows, "user_id,session_date,workout_id,exercise_id");
    await run("exercise_notes", noteRows, "user_id,exercise_id");
    // Limpa só o que foi enviado e não mudou no meio do caminho.
    const cur = readDirty();
    for (const [key, exs] of days) for (const [id, v] of Object.entries(exs)) if (cur.days[key]?.[id] === v) delete cur.days[key][id];
    for (const k of Object.keys(cur.days)) if (!Object.keys(cur.days[k]).length) delete cur.days[k];
    for (const [id, v] of notes) if (cur.notes[id] === v) delete cur.notes[id];
    writeDirty(cur); lastSync = Date.now();
  } catch (err) { syncErr = true; console.warn("sync:", err?.message || err); }
  flushing = false; paintAcct();
  if (syncErr) scheduleFlush(20000); else if (pending()) scheduleFlush(500);
}

// Reconstrói o histórico ("Última vez") a partir dos treinos guardados no aparelho.
function rebuildHist() {
  const pref = `gym.${state.who}.`, byEx = {};
  const keys = []; for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  for (const k of keys) {
    const m = k.startsWith(pref) && k.slice(pref.length).match(/^(\d{4}-\d{2}-\d{2})\.(seg|ter|qua|qui|sex)$/);
    if (!m) continue;
    const day = safe(() => JSON.parse(localStorage.getItem(k)), null); if (!day?.sets) continue;
    for (const [name, sets] of Object.entries(day.sets)) {
      const done = sets.filter(x => x && x.done); if (!done.length) continue;
      (byEx[name] ||= []).push({ d: m[1], kg: day.kg?.[name] || "", reps: done.map(x => x.reps), types: done.map(x => x.type), rir: day.rir?.[name] ?? null });
    }
  }
  for (const [name, list] of Object.entries(byEx)) {
    list.sort((a, b) => a.d.localeCompare(b.d));
    safe(() => localStorage.setItem(histKey(name), JSON.stringify(list.slice(-60))));
  }
}

async function pull() {
  if (!sb || !uid() || !navigator.onLine) return;
  const fetchAll = async (table, cols, filter, order) => {
    let out = [], from = 0;
    for (;;) {
      let q = filter(sb.from(table).select(cols));
      for (const o of order) q = q.order(o);
      const { data: rows, error } = await q.range(from, from + 999);
      if (error) throw error;
      out = out.concat(rows); if (rows.length < 1000) break; from += 1000;
    }
    return out;
  };
  try {
    const since = dateMinus(90);
    const [setRows, exRows, noteRows] = await Promise.all([
      fetchAll("set_logs", "session_date,workout_id,exercise_id,set_index,reps,kg,set_type,done", q => q.gte("session_date", since), ["session_date", "workout_id", "exercise_id", "set_index"]),
      fetchAll("exercise_logs", "session_date,workout_id,exercise_id,rir", q => q.gte("session_date", since), ["session_date", "workout_id", "exercise_id"]),
      fetchAll("exercise_notes", "exercise_id,note", q => q, ["exercise_id"])
    ]);
    const dirty = readDirty(), me = state.who; // o usuário pode trocar durante a consulta
    if (uid() !== me) return;
    let changed = false;
    const groups = {};
    for (const r of setRows) ((groups[`${r.session_date}|${r.workout_id}`] ||= {})[r.exercise_id] ||= []).push(r);
    const rirOf = {}; for (const r of exRows) rirOf[`${r.session_date}|${r.workout_id}|${r.exercise_id}`] = r.rir;
    for (const [key, exs] of Object.entries(groups)) {
      const [date, wid] = key.split("|"), w = WORKOUTS.find(x => x.id === wid); if (!w) continue;
      const lk = dayKeyFor(date, wid), before = localStorage.getItem(lk);
      const day = safe(() => JSON.parse(before), null) || { sets: {}, kg: {}, rir: {} };
      day.sets ||= {}; day.kg ||= {}; day.rir ||= {};
      for (const [exId, rows] of Object.entries(exs)) {
        const e = w.ex.find(x => x.id === exId);
        if (!e || dirty.days[key]?.[exId]) continue; // alteração local ainda não enviada vence
        day.sets[e.n] = Array.from({ length: e.s }, (_, i) => { const r = rows.find(x => x.set_index === i); return r ? { done: r.done, reps: r.reps, type: r.set_type } : normSet(undefined, e, i); });
        const kgRow = rows.find(x => x.kg != null); if (kgRow) day.kg[e.n] = fmtKg(kgRow.kg); else delete day.kg[e.n];
        const rir = rirOf[`${date}|${wid}|${exId}`];
        if (rir != null) day.rir[e.n] = rir; else delete day.rir[e.n];
      }
      const after = JSON.stringify(day);
      if (after !== before) { localStorage.setItem(lk, after); changed = true; }
    }
    for (const r of noteRows) {
      const name = EX_NAME[r.exercise_id]; if (!name || dirty.notes[r.exercise_id]) continue;
      if ((localStorage.getItem(noteKey(name)) || "") !== r.note) { localStorage.setItem(noteKey(name), r.note); changed = true; }
    }
    rebuildHist(); lastSync = Date.now(); syncErr = false; paintAcct();
    if (changed && !document.querySelector("dialog[open]")) render();
  } catch (err) { syncErr = true; console.warn("pull:", err?.message || err); paintAcct(); }
}
const syncAll = async () => { await flush(); await pull(); };

// ---- Importar dados antigos deste navegador (antes do login) ----
const LEGACY_DAY = /^gym\.(Eu|Gael)\.(\d{4}-\d{2}-\d{2})\.(seg|ter|qua|qui|sex)$/;
const importedKey = () => `gym.imported.${uid()}`;
function legacyBuckets() {
  const out = {}, done = safe(() => JSON.parse(localStorage.getItem(importedKey())), null) || [];
  for (let i = 0; i < localStorage.length; i++) { const m = localStorage.key(i).match(LEGACY_DAY); if (m) out[m[1]] = (out[m[1]] || 0) + 1; }
  return Object.entries(out).filter(([who]) => !done.includes(who));
}
function importLegacy(who) {
  let days = 0, notes = 0;
  const keys = []; for (let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
  for (const k of keys) {
    const m = k.match(LEGACY_DAY); if (!m || m[1] !== who) continue;
    const [, , date, wid] = m, w = WORKOUTS.find(x => x.id === wid), target = dayKeyFor(date, wid);
    if (!w || localStorage.getItem(target)) continue; // não sobrescreve o que já existe na conta
    const old = safe(() => JSON.parse(localStorage.getItem(k)), null); if (!old?.sets) continue;
    const day = { sets: {}, kg: old.kg || {}, rir: old.rir || {} };
    for (const e of w.ex) {
      if (!old.sets[e.n]) continue;
      day.sets[e.n] = Array.from({ length: e.s }, (_, i) => normSet(old.sets[e.n][i], e, i));
      if (day.sets[e.n].some(x => x.done)) markDirty(wid, e.id, date);
    }
    localStorage.setItem(target, JSON.stringify(day)); days++;
  }
  for (const e of WORKOUTS.flatMap(w => w.ex)) {
    const note = localStorage.getItem(`gym.${who}.note.${e.n}`);
    if (note && !localStorage.getItem(noteKey(e.n))) { localStorage.setItem(noteKey(e.n), note); markNote(e.id); notes++; }
  }
  const done = safe(() => JSON.parse(localStorage.getItem(importedKey())), null) || [];
  localStorage.setItem(importedKey(), JSON.stringify([...done, who]));
  rebuildHist(); flush();
  return { days, notes };
}

// ---- Tela de entrada ----
const ERR = {
  invite: "Este e-mail não foi convidado.",
  rate: "Muitos e-mails enviados em pouco tempo. Use a sua senha ou tente de novo em alguns minutos.",
  creds: "E-mail ou senha incorretos.",
  off: "Sem internet. Conecte-se para entrar."
};
function authError(err) {
  const m = `${err?.message || ""} ${err?.code || ""}`.toLowerCase();
  if (!navigator.onLine || m.includes("failed to fetch") || m.includes("network")) return ERR.off;
  if (m.includes("database error") || m.includes("cadastro fechado") || m.includes("not allowed") || m.includes("signups not allowed")) return ERR.invite;
  if (m.includes("rate") || m.includes("too many") || m.includes("seconds")) return ERR.rate;
  if (m.includes("invalid login") || m.includes("credentials")) return ERR.creds;
  return err?.message || "Não deu certo. Tente de novo.";
}
const LINK_COOLDOWN_S = 60; // intervalo entre pedidos de link, para não gastar o limite de e-mails do Supabase
const lastEmailKey = "gym.lastEmail";
const linkKey = email => `gym.linkAt.${email}`;
const linkWait = email => Math.max(0, LINK_COOLDOWN_S - Math.floor((Date.now() - (+safe(() => localStorage.getItem(linkKey(email)), 0) || 0)) / 1000));

// Barra carregada com anilhas IWF, desenhada em SVG: a marca do app.
function barbell() {
  const plates = [["#f1f1ec", 36], ["#3fbf68", 44], ["#f2c230", 52], ["#4a7cf0", 60], ["#f0444f", 68]], W = 320, H = 72;
  let g = "";
  plates.forEach(([c, h], i) => {
    const x = 24 + i * 12, y = (H - h) / 2;
    g += `<rect class="pl" style="--i:${i};--s:-1" x="${x}" y="${y}" width="10" height="${h}" rx="3" fill="${c}"/>`;
    g += `<rect class="pl" style="--i:${i};--s:1" x="${W - x - 10}" y="${y}" width="10" height="${h}" rx="3" fill="${c}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Barra carregada com anilhas"><rect x="4" y="${H / 2 - 2}" width="${W - 8}" height="4" rx="2" fill="#a6a69f"/><rect x="86" y="${H / 2 - 9}" width="6" height="18" rx="2" fill="#f1f1ec"/><rect x="${W - 92}" y="${H / 2 - 9}" width="6" height="18" rx="2" fill="#f1f1ec"/>${g}</svg>`;
}

function buildAuth() {
  const root = el("section", { class: "auth", "aria-label": "Entrar" },
    el("div", { class: "brand", html: `${barbell()}<h1>Treino do dia</h1><p>Um exercício por vez. Sem perder nada.</p>` }));
  const card = el("div", { class: "card" });
  root.append(card);
  let timer = null;

  const showForm = (prefill = "") => {
    clearInterval(timer);
    const msg = el("p", { class: "msg", role: "status" });
    const mail = el("input", { class: "field", type: "email", id: "auth-mail", name: "email", autocomplete: "username", inputmode: "email", enterkeyhint: "next", autocapitalize: "none", spellcheck: "false", placeholder: "voce@email.com", value: prefill || safe(() => localStorage.getItem(lastEmailKey), "") || "" });
    const pass = el("input", { class: "field", type: "password", id: "auth-pass", name: "password", autocomplete: "current-password", enterkeyhint: "go", placeholder: "Sua senha" });
    const eye = el("button", { type: "button", "aria-label": "Mostrar senha", "aria-pressed": "false", html: icon("eye") });
    eye.addEventListener("click", () => { const show = pass.type === "password"; pass.type = show ? "text" : "password"; eye.setAttribute("aria-pressed", String(show)); eye.setAttribute("aria-label", show ? "Ocultar senha" : "Mostrar senha"); eye.innerHTML = icon(show ? "eyeoff" : "eye"); });
    const go = el("button", { class: "btn", type: "submit" }, "Entrar");
    const link = el("button", { class: "btn ghost", type: "button", id: "auth-link" }, "Receber link por e-mail");
    const fail = t => { msg.className = "msg err"; msg.textContent = t; };
    const readMail = () => {
      const email = mail.value.trim().toLowerCase();
      if (!email || !email.includes("@")) { fail("Digite o seu e-mail."); mail.focus(); return null; }
      if (!sb) { fail("Não consegui carregar o login. Recarregue a página."); return null; }
      return email;
    };
    const card_ = el("form", { novalidate: "" },
      el("h2", {}, "Entrar"),
      el("label", { for: "auth-mail" }, "E-mail"), mail,
      el("label", { for: "auth-pass" }, "Senha"), el("div", { class: "pw" }, pass, eye),
      go, msg,
      el("div", { class: "or" }, "primeiro acesso ou esqueci a senha"),
      link,
      el("p", { class: "help" }, "Enviamos um link de entrada para o e-mail convidado. Depois você define a sua senha."));
    card.replaceChildren(card_);

    // Entrar com senha (caminho principal)
    card_.addEventListener("submit", async ev => {
      ev.preventDefault();
      const email = readMail(); if (!email) return;
      if (!pass.value) { fail("Digite a sua senha, ou peça um link por e-mail."); pass.focus(); return; }
      go.disabled = true; msg.className = "msg"; msg.textContent = "Entrando…";
      try {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass.value });
        if (error) throw error;
        safe(() => localStorage.setItem(lastEmailKey, email));
      } catch (err) { fail(authError(err)); go.disabled = false; pass.focus(); }
    });

    // Link por e-mail (secundário), com intervalo entre envios
    const tickLink = () => {
      const email = mail.value.trim().toLowerCase(), w = email ? linkWait(email) : 0;
      link.disabled = w > 0;
      link.textContent = w > 0 ? `Link enviado · novo em ${fmtClock(w)}` : "Receber link por e-mail";
    };
    mail.addEventListener("input", tickLink); tickLink();
    timer = setInterval(() => { if (!document.contains(card_)) clearInterval(timer); else tickLink(); }, 1000);
    link.addEventListener("click", async () => {
      const email = readMail(); if (!email) return;
      if (linkWait(email) > 0) { tickLink(); return; }
      link.disabled = true; msg.className = "msg"; msg.textContent = "Enviando o link…";
      try {
        const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        safe(() => { localStorage.setItem(linkKey(email), String(Date.now())); localStorage.setItem(lastEmailKey, email); });
        showSent(email);
      } catch (err) { fail(authError(err)); tickLink(); }
    });
  };

  const showSent = email => {
    clearInterval(timer);
    const again = el("button", { class: "btn ghost", type: "button" }, "");
    const back = el("button", { class: "btn ghost", type: "button" }, "Usar senha ou outro e-mail");
    const hint = el("p", { class: "help" });
    const paint = () => { const w = linkWait(email); again.disabled = w > 0; again.textContent = w > 0 ? `Reenviar em ${fmtClock(w)}` : "Reenviar o link"; };
    back.addEventListener("click", () => showForm(email));
    again.addEventListener("click", async () => {
      if (linkWait(email) > 0) return;
      again.disabled = true;
      try {
        const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        safe(() => localStorage.setItem(linkKey(email), String(Date.now()))); hint.textContent = "Enviamos de novo.";
      } catch (err) { hint.textContent = authError(err); }
      paint();
    });
    const box = el("div", { class: "sent", role: "status" },
      el("div", { class: "seal", html: icon("mail") }),
      el("h2", {}, "Link enviado"),
      el("p", { html: "Enviamos para <b></b>. Abra o e-mail <b>neste aparelho</b> e toque no link para entrar." }),
      el("p", { class: "help" }, "Não chegou? Olhe o spam. Na próxima vez você já entra com a senha."),
      again, back, hint);
    box.querySelector("b").textContent = email;
    card.replaceChildren(box);
    paint();
    timer = setInterval(() => { if (!document.contains(box)) clearInterval(timer); else paint(); }, 1000);
  };

  showForm();
  return root;
}

// ---- Conta ----
const acct = $("#acct");
function renderImport() {
  const box = $("#acct-import"), buckets = legacyBuckets(); box.replaceChildren(); box.hidden = !buckets.length;
  if (!buckets.length) return;
  box.append(el("h3", {}, "Dados antigos neste navegador"), el("p", {}, "Treinos salvos antes do login. Escolha de quem são para levar para esta conta."));
  buckets.forEach(([who, n]) => box.append(el("button", { class: "btn ghost", type: "button", style: "margin-bottom:8px", onclick: e => {
    const r = importLegacy(who); e.currentTarget.textContent = `Importado: ${r.days} treino${r.days === 1 ? "" : "s"}, ${r.notes} nota${r.notes === 1 ? "" : "s"}`; e.currentTarget.disabled = true; render();
  } }, `Importar “${who}” (${n} treino${n === 1 ? "" : "s"})`)));
}
function openAcct(nudgePassword = false) {
  $("#acct-mail").textContent = session?.user?.email || ""; $("#acct-pw-msg").className = "msg"; $("#acct-pw-msg").textContent = nudgePassword ? "Defina uma senha para entrar mais rápido da próxima vez, sem precisar do link." : ""; $("#acct-pw-in").value = "";
  renderImport(); paintAcct();
  if (typeof acct.showModal === "function") acct.showModal(); else acct.setAttribute("open", "");
  if (nudgePassword) $("#acct-pw-in").focus();
}
function closeAcct() { if (typeof acct.close === "function") acct.close(); else acct.removeAttribute("open"); }
$("#acct-x").innerHTML = icon("close");
$("#acctbtn").addEventListener("click", () => openAcct());
$("#acct-x").addEventListener("click", closeAcct);
acct.addEventListener("click", e => { if (e.target === acct) closeAcct(); });
$("#acct-now").addEventListener("click", async () => { $("#acct-sync").textContent = "Sincronizando…"; await syncAll(); paintAcct(); });
$("#acct-out").addEventListener("click", async () => { closeAcct(); await sb?.auth.signOut(); });
$("#acct-pw").addEventListener("submit", async ev => {
  ev.preventDefault();
  const m = $("#acct-pw-msg"), v = $("#acct-pw-in").value;
  if (v.length < 8) { m.className = "msg err"; m.textContent = "Use pelo menos 8 caracteres."; return; }
  m.className = "msg"; m.textContent = "Salvando…";
  const { error } = await sb.auth.updateUser({ password: v });
  if (error) { m.className = "msg err"; m.textContent = error.message; } else { m.textContent = "Senha salva. Da próxima vez você pode entrar com ela."; $("#acct-pw-in").value = ""; }
});

// ---- Ciclo de vida ----
function onUserChange() {
  state.who = uid() || "anon"; state.idx = -1;
  render();
  if (uid()) setTimeout(syncAll, 0); // fora do callback de auth, para não travar o cliente
  // Entrou pelo link: convida, uma vez por conta, a criar a senha para as próximas vezes.
  const seen = `gym.pwNudge.${uid()}`;
  if (uid() && arrivedByLink && !safe(() => localStorage.getItem(seen), null)) {
    safe(() => localStorage.setItem(seen, "1"));
    setTimeout(() => openAcct(true), 400);
  }
}
async function initAuth() {
  if (!sb) { render(); return; }
  sb.auth.onAuthStateChange((_ev, s) => { const before = uid(); session = s; if (uid() !== before) onUserChange(); else paintAcct(); });
  const { data: d } = await sb.auth.getSession();
  session = d.session; onUserChange();
  if (!session) await autoLoginFromHash();
}
// Link de convite: #entrar=<e-mail>:<senha>. O fragmento não vai ao servidor e é apagado da barra logo em seguida.
async function autoLoginFromHash() {
  const m = /^#entrar=([^:]+):(.+)$/.exec(location.hash);
  if (!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  try { await sb.auth.signInWithPassword({ email: decodeURIComponent(m[1]), password: decodeURIComponent(m[2]) }); } catch {}
}
addEventListener("online", () => { paintAcct(); syncAll(); });
addEventListener("offline", paintAcct);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && uid()) syncAll(); });
setInterval(() => { if (uid() && pending()) flush(); }, 30000);
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));

initAuth();
</script>
